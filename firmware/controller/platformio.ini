; Aero motion controller firmware — ESP32-C6 Mini + MPU6050
; Build:   python -m platformio run -d firmware/controller
; Flash:   python -m platformio run -d firmware/controller -t upload
; Monitor: python -m platformio device monitor -d firmware/controller -b 115200
[platformio]
default_envs = aero_c6
src_dir = main

[env:aero_c6]
platform = espressif32
board = esp32-c6-devkitm-1
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct
board_build.partitions = partitions.csv
board_build.flash_size = 4MB
board_upload.flash_size = 4MB
build_flags =
    -DAERO_FW_MAJOR=1
    -DAERO_FW_MINOR=0
    -DAERO_FW_PATCH=0
    -DAERO_FW_BUILD=1
    -DAERO_HW_REV=1
    -Wno-unused-function
